name: Release

# Tag-driven: `npm version patch && git push --follow-tags` is the whole release ritual.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — trusted publishing + provenance, so no NPM_TOKEN lives in this repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs a recent npm; the one bundled with Node may lag behind.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # The tag is the source of truth for the version — package.json is written to match, not the
      # other way round, so a tag can never publish a mismatched version.
      - name: Sync version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `prepublishOnly` runs the esbuild bundle; `files` limits the tarball to dist/.
      #
      # A prerelease must not become the default install. npm publishes to the `latest` dist-tag
      # unless told otherwise, so a v0.1.0-beta.0 tag would hand the beta to every `npx
      # control-claude-code` user. Any tag carrying a hyphen goes to the `beta` channel instead,
      # reachable only via an explicit @beta — matching the `latest` docker tag rule above.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag beta ;;
            *)   npm publish ;;
          esac

  # The server half — the CLI's counterpart, for anyone self-hosting rather than using the hosted
  # backend. Independent of the npm job: neither blocks the other.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # amd64 only. arm64 used to ship for self-hosters on a Pi or an ARM VPS, but it had to be
      # emulated through QEMU and that leg dominated the whole release — so it is gone, along with
      # the setup-qemu-action that existed solely to enable it. Anyone on ARM can still build the
      # image locally from this repo (`docker compose up --build`). buildx stays: build-push-action
      # needs it for the gha cache and the push.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no PAT needed; packages: write covers it

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Hardcoded lowercase: ghcr.io rejects uppercase, and github.repository is `DotRacel/…`.
          images: ghcr.io/dotracel/control-claude-code
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build amd64 on its own first and actually run it. build-push-action only proves the image
      # BUILDS: the NODE_ENV bug that made npm skip the pg install produced a perfectly green build
      # and a container that died on boot with ERR_MODULE_NOT_FOUND. Probing before the push is
      # what keeps a broken image off ghcr — nothing else in this pipeline would catch it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ccc:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and probe it
        run: |
          test "$(docker run --rm ccc:probe node --version)" = "v$(cat .nvmrc)"
          docker run -d --name ccc-probe -p 8787:8787 ccc:probe
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then echo "server is up"; exit 0; fi
            sleep 1
          done
          echo "server did not come up in 30s"; docker logs ccc-probe; exit 1

      # Only now push. Every layer comes straight out of the cache the probe build just wrote, so
      # this leg is nearly free — the image that gets pushed is the one that was proven to boot.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
