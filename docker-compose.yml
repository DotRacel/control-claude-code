# Self-hosting the controller: `INVITE_CODE=<码> docker compose up -d` brings up the server and its
# database. The CLI half ships on npm instead (`npx control-claude-code`), and most people will
# never run this — it is for anyone who would rather not point at the hosted backend.
#
# The db port stays published because `npm run server` on the host is still the dev loop; the app
# service reaches the database over the compose network and does not need it.
services:
  app:
    # Published image. `docker compose up --build` builds from this repo instead.
    image: ghcr.io/dotracel/control-claude-code:latest
    build: .
    container_name: ccc-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ccc:ccc@db:5432/ccc
      # Without an invite code registration is closed, so a fresh server nobody can sign up to.
      INVITE_CODE: ${INVITE_CODE:-}
      # Sessions idle this long are deleted with their transcripts (0 = keep everything forever).
      CCC_SESSION_TTL_DAYS: ${CCC_SESSION_TTL_DAYS:-7}
    ports:
      - '8787:8787' # NOT loopback-only: the phone reaches this over the LAN
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: ccc-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccc
      POSTGRES_PASSWORD: ccc
      POSTGRES_DB: ccc
    ports:
      - '127.0.0.1:5432:5432' # loopback only — never expose a dev DB on the LAN
    volumes:
      - ccc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ccc -d ccc']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  ccc-pgdata:
