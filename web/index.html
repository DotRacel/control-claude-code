<!doctype html>
<!-- lang="en" is the FALLBACK, not a claim about this reader: it is what a crawler and the ~0ms
     before React mounts see, and it matches the last resort of the app's own detection. The real
     locale is written onto this element as soon as web/src/i18n/index.ts is evaluated. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#262624" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude Remote" />
    <meta name="application-name" content="Claude Remote" />
    <!-- English for the same reason as `lang` above: this serves crawlers and link previews, so it
         cannot vary per reader the way the UI does. -->
    <meta name="description" content="Drive a Claude Code session on your own machine, from your phone" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- The symbol itself is a transparent SVG, so it is the tab icon directly: it stays sharp at
         any tab-strip density, and browsers that cannot use it fall through to the PNG below. -->
    <link rel="icon" type="image/svg+xml" href="./icons/claude-symbol.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Claude Remote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
